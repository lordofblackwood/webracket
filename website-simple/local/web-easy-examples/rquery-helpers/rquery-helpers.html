      const key = utf8_decode_bytes(uint8array_bytes_slice(this.bytes, space + 1, eq));
      headers[key] = utf8_decode_bytes(uint8array_bytes_slice(this.bytes, eq + 1, recordEnd - 1));
      i = recordEnd;
    }
    return headers;
  }

  readPaxSize(headers) {
    if (!headers || headers.size === undefined) return null;
    if (!/^[0-9]+$/.test(headers.size)) {
      throw new Error('VFS tar pax size is invalid');
    }
    const size = Number(headers.size);
    if (!Number.isSafeInteger(size)) {
      throw new Error('VFS tar pax size is invalid');
    }
    return size;
  }

  readPaxMtime(headers) {
    if (!headers || headers.mtime === undefined) return null;
    if (!/^-?[0-9]+(\.[0-9]+)?$/.test(headers.mtime)) {
      throw new Error('VFS tar pax mtime is invalid');
    }
    const mtime = Number(headers.mtime);
    if (!Number.isFinite(mtime) || !Number.isSafeInteger(Math.trunc(mtime))) {
      throw new Error('VFS tar pax mtime is invalid');
    }
    return Math.trunc(mtime);
  }

  validateChecksum(offset) {
    const expected = this.readOctal(offset + 148, 8, -1, 'header checksum');
    let actual = 0;
    for (let i = 0; i < 512; i++) {
      actual += (i >= 148 && i < 156) ? 32 : this.bytes[offset + i];
    }
    if (expected !== actual) {
      throw new Error('VFS tar header checksum is invalid');
    }
  }

  addParentDirs(path, mtime = 0) {
    const parts = this.normalize(path).split('/').filter(Boolean);
    let cur = '/';
    for (let i = 0; i < parts.length - 1; i++) {
      cur = cur === '/' ? `/${parts[i]}` : `${cur}/${parts[i]}`;
      if (!this.dirs.has(cur)) {
        this.dirs.set(cur, { mtime, mode: 0o777, identity: this.nextId++ });
      }
    }
  }

  parse() {
    let nextLongName = null;
    let nextLongLink = false;
    let nextPaxHeaders = null;
    let globalPaxHeaders = {};
    let offset = 0;
    for (; offset + 512 <= this.bytes.length;) {
      let empty = true;
      for (let i = 0; i < 512; i++) {
        if (this.bytes[offset + i] !== 0) {
          empty = false;
          break;
        }
      }
      if (empty) break;

      this.validateChecksum(offset);
      const name = this.readString(offset, 100);
      const prefix = this.readString(offset + 345, 155);
      const rawPath = prefix ? `${prefix}/${name}` : name;
      const size = this.readOctal(offset + 124, 12, 0, 'size');
      const mtime = this.readOctal(offset + 136, 12, 0, 'mtime');
      const mode = this.readOctal(offset + 100, 8, 0o666, 'mode');
      const typeflag = String.fromCharCode(this.bytes[offset + 156] || 0);
      const dataStart = offset + 512;
      const dataSize = (typeflag === '0' || typeflag === '\0')
        ? (this.readPaxSize(nextPaxHeaders) ?? size)
        : size;
      const nextOffset = dataStart + Math.ceil(dataSize / 512) * 512;
      if (nextOffset > this.bytes.length) {
        throw new Error('VFS tar entry data is truncated');
      }
      if (typeflag === 'L') {
        nextLongName = this.readString(dataStart, size);
        offset = nextOffset;
        continue;
      }
      if (typeflag === 'K') {
        nextLongLink = true;
        offset = nextOffset;
        continue;
      }
      if (typeflag === 'g') {
        globalPaxHeaders = this.readPaxHeaders(dataStart, size);
        offset = nextOffset;
        continue;
      }
      if (typeflag === 'x') {
        nextPaxHeaders = this.readPaxHeaders(dataStart, size);
        offset = nextOffset;
        continue;
      }
      const entryPath = (nextPaxHeaders && nextPaxHeaders.path) || nextLongName || rawPath;
      const entryMtime =
        this.readPaxMtime(nextPaxHeaders) ?? this.readPaxMtime(globalPaxHeaders) ?? mtime;
      nextLongName = null;
      nextLongLink = false;
      nextPaxHeaders = null;
      const path = this.archivePath(entryPath);

      if (typeflag === '5' || entryPath.endsWith('/')) {
        if (this.files.has(path)) {
          throw new Error(`VFS tar file/directory conflict: ${path}`);
        }
        if (path !== '/' && !this.dirs.has(path)) {
          this.addParentDirs(path, entryMtime);
          this.dirs.set(path, { mtime: entryMtime, mode: mode || 0o777, identity: this.nextId++ });
        }
      } else if (typeflag === '0' || typeflag === '\0') {
        if (this.dirs.has(path)) {
          throw new Error(`VFS tar file/directory conflict: ${path}`);
        }
        this.addParentDirs(path, entryMtime);
        this.files.set(path, { start: dataStart, size: dataSize, mtime: entryMtime, mode: mode || 0o666, identity: this.nextId++ });
      } else if (typeflag === '1' || typeflag === '2') {
        throw new Error(`VFS tar link entries are unsupported: ${path}`);
      } else {
        throw new Error(`VFS tar entry type is unsupported: ${typeflag || 'NUL'} for ${path}`);
      }

      offset = nextOffset;
    }
    if (nextLongName !== null || nextLongLink || nextPaxHeaders !== null) {
      throw new Error('VFS tar extension entry has no target');
    }
    for (let i = offset; i < this.bytes.length; i++) {
      if (this.bytes[i] !== 0) {
        throw new Error('VFS tar trailing data is invalid');
      }
    }
  }

  readOnly(path) {
    throw new Error(`VFS tar backend is read-only: ${path}`);
  }

  stat(path) {
    const p = this.normalize(path);
    if (this.files.has(p)) {
      const f = this.files.get(p);
      return { type: 'file', size: f.size, mtime: f.mtime, mode: f.mode, identity: f.identity };
    }
    if (this.dirs.has(p)) {
      const d = this.dirs.get(p);
      return { type: 'directory', size: 0, mtime: d.mtime, mode: d.mode, identity: d.identity };
    }
    return { type: 'missing', size: 0, mtime: 0 };
  }

  readFile(path) {
    const p = this.normalize(path);
    if (!this.files.has(p)) throw new Error(`VFS file not found: ${path}`);
    const f = this.files.get(p);
    return uint8array_bytes_slice(this.bytes, f.start, f.start + f.size);
  }

  listDir(path) {
    const p = this.normalize(path);
    if (!this.dirs.has(p)) throw new Error(`VFS directory not found: ${path}`);
    const prefix = p === '/' ? '/' : `${p}/`;
    const names = new Set();
    for (const file of this.files.keys()) {
      if (file.startsWith(prefix)) names.add(file.slice(prefix.length).split('/')[0]);
    }
    for (const dir of this.dirs.keys()) {
      if (dir !== p && dir.startsWith(prefix)) names.add(dir.slice(prefix.length).split('/')[0]);
    }
    return [...names].filter(Boolean).sort();
  }

  modifySeconds(path, secs = undefined) {
    if (secs !== undefined) this.readOnly(path);
    const stat = this.stat(path);
    if (stat.type === 'missing') throw new Error(`VFS path not found: ${path}`);
    return stat.mtime;
  }

  permissions(path, mode = undefined) {
    if (mode !== undefined) this.readOnly(path);
    const stat = this.stat(path);
    if (stat.type === 'missing') throw new Error(`VFS path not found: ${path}`);
    return stat.mode;
  }

  identity(path) {
    const stat = this.stat(path);
    if (stat.type === 'missing') throw new Error(`VFS path not found: ${path}`);
    return stat.identity;
  }

  writeFile(path) { this.readOnly(path); }
  mkdir(path) { this.readOnly(path); }
  mkdirp(path) { this.readOnly(path); }
  deleteFile(path) { this.readOnly(path); }
  deleteDirectory(path) { this.readOnly(path); }
  deleteTree(path) { this.readOnly(path); }
  rename(oldPath) { this.readOnly(oldPath); }
  copyFile(srcPath) { this.readOnly(srcPath); }
  copyTree(srcPath) { this.readOnly(srcPath); }
}

class WebRacketVFS {
  constructor() {
    this.mounts = new Map();
    this.mount('/tmp', new WebRacketMemoryBackend());
    this.mount('/app', new WebRacketMemoryBackend());
  }

  normalize(path) {
    const s = String(path || '/');
    return s.startsWith('/') ? s.replace(/\/+$/, '') || '/' : `/${s}`.replace(/\/+$/, '') || '/';
  }

  mount(mountPoint, backend) {
    this.mounts.set(this.normalize(mountPoint), backend);
  }

  mountChildren(path) {
    const p = this.normalize(path);
    const prefix = p === '/' ? '/' : `${p}/`;
    const names = new Set();
    for (const mountPoint of this.mounts.keys()) {
      if (mountPoint !== p && mountPoint.startsWith(prefix)) {
        const name = mountPoint.slice(prefix.length).split('/')[0];
        if (name) names.add(name);
      }
    }
    return names;
  }

  syntheticMountIdentity(path) {
    const p = this.normalize(path);
    let hash = 2166136261;
    for (let i = 0; i < p.length; i++) {
      hash ^= p.charCodeAt(i);
      hash = Math.imul(hash, 16777619) >>> 0;
    }
    return 0x10000000 + (hash & 0x0fffffff);
  }

  syntheticMountStat(path) {
    const p = this.normalize(path);
    const isSyntheticRoot = p === '/' && !this.mounts.has('/');
    return (isSyntheticRoot || this.mountChildren(p).size > 0)
      ? { type: 'directory', size: 0, mtime: 0, mode: 0o777, identity: this.syntheticMountIdentity(path) }
      : null;
  }

  syntheticMountReadOnly(path) {
    if (this.syntheticMountStat(path)) {
      throw new Error(`VFS synthetic mount directory is read-only: ${path}`);
    }
  }

  rootList() {
    if (this.mounts.has('/')) return ['/'];
    return this.listDir('/').map((name) => `/${name}/`);
  }

  resolve(path) {
    const p = this.normalize(path);
    let best = null;
    for (const mountPoint of this.mounts.keys()) {
      if (p === mountPoint || (mountPoint === '/' ? p.startsWith('/') : p.startsWith(`${mountPoint}/`))) {
        if (best === null || mountPoint.length > best.length) best = mountPoint;
      }
    }
    if (best === null) throw new Error(`VFS path is not mounted: ${path}`);
    const rel = p === best ? '/' : p.slice(best.length);
    return [this.mounts.get(best), rel || '/'];
  }

  stat(path) {
    const p = this.normalize(path);
    const synthetic = this.syntheticMountStat(p);
    try {
      const [backend, rel] = this.resolve(path);
      const stat = backend.stat(rel);
      return stat.type === 'missing' && synthetic ? synthetic : stat;
    } catch (err) {
      if (synthetic) return synthetic;
      throw err;
    }
  }

  readFile(path) {
    const [backend, rel] = this.resolve(path);
    return backend.readFile(rel);
  }

  writeFile(path, bytes) {
    this.syntheticMountReadOnly(path);
    const [backend, rel] = this.resolve(path);
    backend.writeFile(rel, bytes);
  }

  mkdir(path) {
    this.syntheticMountReadOnly(path);
    const [backend, rel] = this.resolve(path);
    backend.mkdir(rel);
  }

  mkdirp(path) {
    this.syntheticMountReadOnly(path);
    const [backend, rel] = this.resolve(path);
    backend.mkdirp(rel);
  }

  makeParentDirectory(path) {
    const p = this.normalize(path);
    if (p === '/') return;
    const slash = p.lastIndexOf('/');
    const parent = slash <= 0 ? '/' : p.slice(0, slash);
    if (parent === '/') return;
    this.mkdirp(parent);
  }

  deleteFile(path) {
    this.syntheticMountReadOnly(path);
    const [backend, rel] = this.resolve(path);
    backend.deleteFile(rel);
  }

  deleteDirectory(path) {
    this.syntheticMountReadOnly(path);
    const [backend, rel] = this.resolve(path);
    backend.deleteDirectory(rel);
  }

  deleteTree(path) {
    this.syntheticMountReadOnly(path);
    const [backend, rel] = this.resolve(path);
    backend.deleteTree(rel);
  }

  rename(oldPath, newPath, existsOk = false) {
    this.syntheticMountReadOnly(oldPath);
    this.syntheticMountReadOnly(newPath);
    const [oldBackend, oldRel] = this.resolve(oldPath);
    const [newBackend, newRel] = this.resolve(newPath);
    if (oldBackend !== newBackend) throw new Error(`VFS cross-backend rename is not supported: ${oldPath}`);
    oldBackend.rename(oldRel, newRel, existsOk);
  }

  copyFile(srcPath, destPath, existsOk = false) {
    this.syntheticMountReadOnly(destPath);
    const [srcBackend, srcRel] = this.resolve(srcPath);
    const [destBackend, destRel] = this.resolve(destPath);
    if (srcBackend !== destBackend) throw new Error(`VFS cross-backend copy is not supported: ${srcPath}`);
    srcBackend.copyFile(srcRel, destRel, existsOk);
  }

  copyTree(srcPath, destPath) {
    this.syntheticMountReadOnly(destPath);
    const [srcBackend, srcRel] = this.resolve(srcPath);
    const [destBackend, destRel] = this.resolve(destPath);
    if (srcBackend !== destBackend) throw new Error(`VFS cross-backend copy is not supported: ${srcPath}`);
    srcBackend.copyTree(srcRel, destRel);
  }

  modifySeconds(path, secs = undefined) {
    const synthetic = this.syntheticMountStat(path);
    if (synthetic) {
      if (secs !== undefined) throw new Error(`VFS synthetic mount directory is read-only: ${path}`);
      return synthetic.mtime;
    }
    const [backend, rel] = this.resolve(path);
    return backend.modifySeconds(rel, secs);
  }

  permissions(path, mode = undefined) {
    const synthetic = this.syntheticMountStat(path);
    if (synthetic) {
      if (mode !== undefined) throw new Error(`VFS synthetic mount directory is read-only: ${path}`);
      return synthetic.mode;
    }
    const [backend, rel] = this.resolve(path);
    return backend.permissions(rel, mode);
  }

  identity(path) {
    const synthetic = this.syntheticMountStat(path);
    if (synthetic) return synthetic.identity;
    const [backend, rel] = this.resolve(path);
    return backend.identity(rel);
  }

  listDir(path) {
    const p = this.normalize(path);
    const children = this.mountChildren(p);
    if (p === '/' && !this.mounts.has('/')) {
      return [...children].sort();
    }
    let names;
    let stat = null;
    try {
      const [backend, rel] = this.resolve(p);
      stat = backend.stat(rel);
      names = stat.type === 'missing' && children.size > 0
        ? new Set()
        : new Set(backend.listDir(rel));
    } catch (err) {
      if (children.size === 0 || (stat && stat.type !== 'missing')) throw err;
      names = new Set();
    }
    for (const name of children) names.add(name);
    return [...names].sort();
  }

  preload(entries) {
    preloadWebRacketVFS(this, entries);
  }

  async preloadAsync(entries) {
    await preloadWebRacketVFSAsync(this, entries);
  }
}

const webracketVFS = new WebRacketVFS();
globalThis.WebRacketVFS = WebRacketVFS;
globalThis.WebRacketMemoryBackend = WebRacketMemoryBackend;
globalThis.WebRacketTarBackend = WebRacketTarBackend;
globalThis.webracketVFS = webracketVFS;

function decodeVFSBase64(s) {
  const text = String(s);
  if (!/^([A-Za-z0-9+/]{4})*([A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(text)) {
    throw new Error('WebRacket VFS base64 preload is invalid');
  }
  if (typeof atob === 'function') {
    const bin = atob(text);
    const bytes = new hostUint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  if (typeof Buffer !== 'undefined') {
    return new hostUint8Array(Buffer.from(text, 'base64'));
  }
  throw new Error('WebRacket VFS base64 preload requires atob or Buffer');
}

function vfsPreloadBytes(entry) {
  if (entry instanceof hostUint8Array) return new hostUint8Array(entry);
  if (entry instanceof hostArrayBufferForBridge) return new hostUint8Array(entry);
  if (hostArrayBufferIsViewForVfs(entry)) {
    return new hostUint8Array(new hostUint8Array(entry.buffer, entry.byteOffset, entry.byteLength));
  }
  if (hostArrayIsArrayForFasl(entry)) return hostUint8ArrayFrom(entry);
  if (typeof entry === 'string') return utf8_encode_string(entry);
  if (entry && typeof entry === 'object') {
    if ('bytes' in entry) return vfsPreloadBytes(entry.bytes);
    if ('text' in entry) return utf8_encode_string(entry.text);
    if ('base64' in entry) return decodeVFSBase64(entry.base64);
    if ('file' in entry || 'url' in entry || typeof entry.directory === 'string') {
      throw new Error('WebRacket VFS file, URL, and host directory preloads require preloadWebRacketVFSAsync');
    }
  }
  throw new Error('WebRacket VFS preload entry must contain bytes, text, or base64 data');
}

async function vfsPreloadBytesAsync(entry) {
  if (entry && typeof entry === 'object') {
    if ('file' in entry) {
      if (typeof fs === 'undefined' || !fs.readFile) {
        throw new Error('WebRacket VFS file preload requires the Node runtime');
      }
      return new hostUint8Array(await fs.readFile(resolvePreloadFile(entry.file)));
    }
    if ('url' in entry) {
      if (typeof fetch === 'undefined') {
        throw new Error('WebRacket VFS URL preload requires fetch');
      }
      const url = new URL(String(entry.url), import.meta.url);
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`WebRacket VFS URL preload failed: ${url.href}`);
      }
      return new hostUint8Array(await response.arrayBuffer());
    }
  }
  return vfsPreloadBytes(entry);
}

async function decompressVFSGzip(bytes) {
  if (typeof DecompressionStream !== 'undefined') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new hostUint8Array(await new Response(stream).arrayBuffer());
  }
  if (typeof process !== 'undefined' && process.versions && process.versions.node) {
    const zlib = await import('node:zlib');
    return new hostUint8Array(await new Promise((resolve, reject) => {
      zlib.gunzip(Buffer.from(bytes), (err, output) => err ? reject(err) : resolve(output));
    }));
  }
  throw new Error('WebRacket VFS gzip tar mount requires DecompressionStream or Node zlib');
}

function vfsBytesLookLikeGzip(bytes) {
  return bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b;
}

function vfsTarSourceNameLooksGzip(entry) {
  if (!entry || typeof entry !== 'object') return false;
  const source = 'file' in entry ? entry.file : ('url' in entry ? entry.url : null);
  return typeof source === 'string' && /\.(tar\.gz|tgz)$/i.test(source);
}

async function decompressVFSGzipForVFS(bytes) {
  try {
    return await decompressVFSGzip(bytes);
  } catch (err) {
    const message = err && err.message ? err.message : String(err);
    throw new Error(`WebRacket VFS gzip decompression failed: ${message}`);
  }
}

async function vfsPreloadTarBytesAsync(entry) {
  const bytes = await vfsPreloadBytesAsync(entry);
  if (!entry || typeof entry !== 'object' || !('compression' in entry)) {
    return (vfsTarSourceNameLooksGzip(entry) || vfsBytesLookLikeGzip(bytes))
      ? await decompressVFSGzipForVFS(bytes)
      : bytes;
  }
  const compression = String(entry.compression);
  if (compression === 'gzip') return await decompressVFSGzipForVFS(bytes);
  throw new Error(`WebRacket VFS tar compression is unsupported: ${compression}`);
}

function vfsMountPairs(entries) {
  if (!entries) return [];
  if (hostArrayIsArrayForFasl(entries)) {
    return entries.map((entry) => {
      if (hostArrayIsArrayForFasl(entry) && entry.length >= 2) return [entry[0], entry[1]];
      if (entry && typeof entry === 'object' && 'path' in entry) return [entry.path, entry];
      throw new Error('WebRacket VFS mount array entries need a path');
    });
  }
  if (typeof entries === 'object') return Object.entries(entries);
  throw new Error('WebRacket VFS mount manifest must be an array or object');
}

async function mountWebRacketVFSAsync(vfs, entries) {
  for (const [path, entry] of vfsMountPairs(entries)) {
    const p = validateVFSPreloadPath(path);
    if (entry instanceof WebRacketMemoryBackend || entry instanceof WebRacketTarBackend) {
      vfs.mount(p, entry);
    } else if (entry && typeof entry === 'object' && 'tar' in entry) {
      vfs.mount(p, new WebRacketTarBackend(await vfsPreloadTarBytesAsync(entry.tar)));
    } else {
      throw new Error('WebRacket VFS mount entry must be a backend or { tar: ... }');
    }
  }
}

function resolvePreloadFile(path) {
  const s = String(path);
  return s.startsWith('/') ? s : new URL(s, import.meta.url);
}

function ensureDirectoryURL(path) {
  const s = String(path);
  const withSlash = s.endsWith('/') ? s : `${s}/`;
  return s.startsWith('/') ? new URL(`file://${withSlash}`) : new URL(withSlash, import.meta.url);
}

function vfsJoinPath(base, name) {
  const b = String(base || '/').replace(/\/+$/, '') || '/';
  return b === '/' ? `/${name}` : `${b}/${name}`;
}

function hostJoinPath(base, name) {
  return new URL(name, ensureDirectoryURL(base));
}

function vfsPreloadPairs(entries) {
  let pairs;
  if (!entries) return [];
  if (hostArrayIsArrayForFasl(entries)) {
    pairs = entries.map((entry) => {
      if (hostArrayIsArrayForFasl(entry) && entry.length >= 2) return [entry[0], entry[1]];
      if (entry && typeof entry === 'object' && 'path' in entry) return [entry.path, entry];
      throw new Error('WebRacket VFS preload array entries need a path');
    });
  } else if (typeof entries === 'object') {
    pairs = Object.entries(entries);
  } else {
    throw new Error('WebRacket VFS preload manifest must be an array or object');
  }
  const seen = new Set();
  for (const [path] of pairs) {
    const p = normalizeVFSPreloadDuplicatePath(validateVFSPreloadPath(path));
    if (seen.has(p)) throw new Error(`WebRacket VFS duplicate preload path: ${p}`);
    seen.add(p);
  }
  return pairs;
}

function normalizeVFSPreloadDuplicatePath(path) {
  return path.replace(/\/+$/, '') || '/';
}

function validateVFSPreloadPath(path) {
  const p = String(path);
  if (p.length === 0) throw new Error('WebRacket VFS preload path is empty');
  if (!p.startsWith('/')) throw new Error(`WebRacket VFS preload path must be absolute: ${p}`);
  if (p.includes('\0')) throw new Error('WebRacket VFS preload path contains NUL');
  return p;
}

function preloadWebRacketVFS(vfs, entries) {
  for (const [path, entry] of vfsPreloadPairs(entries)) {
    const p = validateVFSPreloadPath(path);
    if ((entry && entry.directory === true) || p.endsWith('/')) {
      vfs.mkdirp(p);
    } else {
      vfs.writeFile(p, vfsPreloadBytes(entry));
    }
  }
}

async function preloadWebRacketVFSAsync(vfs, entries) {
  for (const [path, entry] of vfsPreloadPairs(entries)) {
    const p = validateVFSPreloadPath(path);
    if ((entry && entry.directory === true) || p.endsWith('/')) {
      vfs.mkdirp(p);
    } else if (entry && typeof entry === 'object' && typeof entry.directory === 'string') {
      if (typeof fs === 'undefined' || !fs.readdir || !fs.readFile) {
        throw new Error('WebRacket VFS directory preload requires the Node runtime');
      }
      vfs.mkdirp(p);
      const sourceDirectory = resolvePreloadFile(entry.directory);
      const children = await fs.readdir(sourceDirectory, { withFileTypes: true });
      for (const child of children) {
        const childSource = hostJoinPath(sourceDirectory, child.name);
        const childPath = vfsJoinPath(p, child.name);
        if (child.isDirectory()) {
          await preloadWebRacketVFSAsync(vfs, [[childPath, { directory: childSource }]]);
        } else if (child.isFile()) {
          vfs.writeFile(childPath, new hostUint8Array(await fs.readFile(childSource)));
        }
      }
    } else {
      vfs.writeFile(p, await vfsPreloadBytesAsync(entry));
    }

function is_pair(v) {
    return v && typeof v === 'object' && v.tag === 'pair'
}

function is_alist(v) {
    let list = v
    while (list !== null) {
        if (!is_pair(list)) return false
        if (!is_pair(list.car)) return false
        list = list.cdr
    }
    return true
}

function alist_to_vector_pairs(alist) {
    const result = []
    let   list   = alist
    while (list !== null) {
        const entry = list.car
        result.push([entry.car, entry.cdr])
        list = list.cdr
    }
    return result
}


function testsuite(js_value_to_fasl, fasl_to_js_value, { log = true } = {}) {
  // --- helpers -------------------------------------------------------------
  function charToString(v) {
    if (typeof v === 'string' && v.length === 1) return v;
    if (v && typeof v === 'object' && v.tag === 'char' && typeof v.cp === 'number') {
      try { return hostStringFromCodePointForFasl(v.cp); } catch { /* fall through */ }
    }
    return null;
  }

  function deepEq(a, b) {
    // Treat "char-wrappers" and 1-char strings as equal
    const ac = charToString(a), bc = charToString(b);
    if (ac !== null || bc !== null) return ac === bc;
    // numbers (handle NaN, -0)
    if (typeof a === 'number' || typeof b === 'number') return Object.is(a, b);
    // Uint8Array (bytes)
    if (a instanceof hostUint8Array && b instanceof hostUint8Array) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
      return true;
    }
    // Symbols (use registry key or description)
    if (typeof a === 'symbol' && typeof b === 'symbol') {
      const ka = hostSymbolKeyFor(a) ?? a.description ?? '';
      const kb = hostSymbolKeyFor(b) ?? b.description ?? '';
      return ka === kb;
    }
    if (a && b && a.tag === 'keyword' && b.tag === 'keyword') {
      return a.name === b.name;
    }
    // Pairs
    if (a && b && a.tag === 'pair' && b.tag === 'pair') {
      return deepEq(a.car, b.car) && deepEq(a.cdr, b.cdr);
    }
    // Arrays (vectors)
    if (hostArrayIsArrayForFasl(a) && hostArrayIsArrayForFasl(b)) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (!deepEq(a[i], b[i])) return false;
      return true;
    }
    // Strings, booleans, null, undefined, "<eof>"
    return a === b;
  }
  function roundtrip(v) {
    const bytes = js_value_to_fasl(v);
    const [v2] = fasl_to_js_value(bytes);
    const ok = deepEq(v2, v);
    if (!ok && log) {
      console.error('Roundtrip mismatch:', v, '->', v2, 'bytes=', bytes);
    }
    return ok;
  }
  function test(name, v) {
    const ok = roundtrip(v);
    results.push({ name, ok });
    if (log) console.log(`${ok ? '✓' : '✗'} ${name}`);
    if (ok) pass++; else fail++;
  }

  // --- run tests -----------------------------------------------------------
  const results = [];
  let pass = 0, fail = 0;

  // Fixnums (30-bit)
  test('fixnum 0', 0);
  test('fixnum 123', 123);
  test('fixnum -5', -5);
  // Flonums
  test('flonum 1.5', 1.5);
  test('flonum -0.0', -0.0);
  test('flonum NaN', NaN);
  test('flonum +Inf', Infinity);
  test('flonum -Inf', -Infinity);
  // Booleans / null / void / eof
  test('boolean true', true);
  test('boolean false', false);
  test('null', null);
  test('void/undefined', undefined);
  test('eof sentinel', '<eof>');
  // Characters (encode via wrapper; decoder yields 1-char string)
  test('char A', { tag: 'char', cp: 'A'.codePointAt(0) });
  test('char snowman', { tag: 'char', cp: '☃'.codePointAt(0) });
  // Symbols
  test('symbol foo', hostSymbolFor('foo'));
  test('keyword attrs', { tag: 'keyword', name: 'attrs' });
  // Bytes (Uint8Array)
  test('bytes', new hostUint8Array([0, 1, 2, 255]));
  // Pairs
  test('pair (1 . null)', { tag: 'pair', car: 1, cdr: null });
  test('list (1 2)',
       { tag: 'pair', car: 1, cdr: { tag: 'pair', car: 2, cdr: null } });
  // Vectors (arrays)
  test('vector mixed',
       [ 1, 2.5, { tag: 'pair', car: 'x', cdr: null }, true ]);
  // Strings
  test('string ascii', 'hello');
  test('string utf8', 'héllø 🌍');

  return { pass, fail, total: pass + fail, results };
}

function callback_expected_arity_text(id) {

function callback_name_text(id) {

    const value = fasl_to_js_value(new hostUint8Array(memory.buffer, CALLBACK_BUFFER_BASE, len))[0];
    if (typeof value === 'symbol') {

function callback_debug_id_text(id) {

    const len = callback_debug_id_export(id);
    const value = fasl_to_js_value(new hostUint8Array(memory.buffer, CALLBACK_BUFFER_BASE, len))[0];

function callback_error_text(id, argc, kind, detail) {
    const expected = callback_expected_arity_text(id);
    const debug_id = callback_debug_id_text(id);
    const debug_line = debug_id ? `\n  debug-id: ${debug_id}` : '';
    return `WebRacket callback error\n  kind: ${kind}\n  name: ${callback_display_name_text(id)}\n  id: ${id}${debug_line}\n  expected: ${expected}\n  argc: ${argc}\n  detail: ${detail}`;
}

export function make_callback(id) {
    return (...args) => {
        const argc = args.length;
        if (callback_accepts_argc_export &&
            callback_accepts_argc_export(id, argc) === 0) {
            throw new TypeError(
                callback_error_text(id, argc, 'arity-mismatch', 'callback arity mismatch')
            );
        }
        try {
            const fasl = js_value_to_fasl(hostArrayFromForFasl(args));
            if (fasl.length > CALLBACK_BUFFER_LENGTH) {
                throw new RangeError('WebRacket callback argument FASL exceeds callback buffer');
            }
            memory_bytes_set(fasl, CALLBACK_BUFFER_BASE);
            const len = callback_export(id, CALLBACK_BUFFER_BASE);
            const [ok, payload] =
                fasl_to_js_value(new hostUint8Array(memory.buffer, CALLBACK_BUFFER_BASE, len))[0];
            if (ok) {
                return payload;
            }
            const message =
                (typeof payload === 'string' && payload.length > 0)
                ? payload
                : 'The callback raised a WebRacket exception.';
            throw new Error(
                callback_error_text(id, argc, 'callback-failed', message)
            );
        } catch (err) {
            const isWasmException = err instanceof hostWebAssemblyException;
            if (isWasmException) {
                const isArityMismatch = callback_accepts_argc_export
                    ? (callback_accepts_argc_export(id, argc) === 0)
                    : false;
                if (isArityMismatch) {
                    throw new TypeError(
                        callback_error_text(id, argc, 'arity-mismatch', 'callback arity mismatch')
                    );
                }
                const wrapped = new Error(
                    callback_error_text(
                        id,
                        argc,
                        'callback-failed',
                        'The callback raised a WebRacket exception.'
                    )
                );
                wrapped.cause = err;
                throw wrapped;
            }
            throw err;
        }
    };
}

// Browser Console Bridge
// ----------------------
// Installs globalThis.WR for browser builds when the console bridge is enabled.

// Invoke a Wasm export with a FASL-encoded payload and decode the FASL result.
function wr_invoke_fasl(exported, payload) {
  const fasl = js_value_to_fasl(payload);
  if (fasl.length > CALLBACK_BUFFER_LENGTH) {
    throw new RangeError('WebRacket console bridge FASL exceeds callback buffer');
  }
  memory_bytes_set(fasl, CALLBACK_BUFFER_BASE);
  const len = exported(CALLBACK_BUFFER_BASE);
  return fasl_to_js_value(new hostUint8Array(memory.buffer, CALLBACK_BUFFER_BASE, len))[0];
}

// Decode the tagged bridge result vector into a JavaScript object.
function wr_decode_result(raw, operation, name, args) {
  if (!hostArrayIsArrayForFasl(raw) || raw.length < 5) {
    return {
      ok: false,
      kind: 'invalid-bridge-result',
      value: undefined,
      printed: '',
      error: 'invalid WebRacket console bridge result',
      message: 'invalid WebRacket console bridge result',
      operation,
      name,
      args,
      request: { operation, name, args },
    };
  }
  const [ok, kind, value, printed, error] = raw;
  const message = !!ok
    ? ''
    : ((typeof error === 'string' && error.length > 0)
      ? error
      : `WebRacket console bridge error (${String(kind)})`);
  return {
    ok: !!ok,
    kind,
    value,
    printed: (typeof printed === 'string') ? printed : '',
    error: (typeof error === 'string') ? error : '',
    message,
    operation,
    name,
    args,
    request: { operation, name, args },
  };
}

// Format a JavaScript value through the WebRacket formatter when available.
function wr_format_value(exported, value) {
  if (!exported) {
    return String(value);
  }
  const formatted = wr_invoke_fasl(exported, value);
  return (typeof formatted === 'string') ? formatted : String(formatted);
}

// Normalize detailed binding metadata returned by the Wasm bridge.
function wr_decode_names_detailed(raw) {
  if (!hostArrayIsArrayForFasl(raw)) {
    return [];
  }
  return raw
    .map((entry) => {
      if (!hostArrayIsArrayForFasl(entry) || entry.length < 5) {
        return {
          name: String(entry),
          origin: 'unknown',
          mutable: false,
          kind: 'top-level',
          source: null,
        };
      }
      const [name, origin, mutable, _kind, source] = entry;
      return {
        name: String(name),
        origin: (typeof origin === 'string' && origin.length > 0) ? origin : 'unknown',
        mutable: !!mutable,
        kind: 'top-level',
        source: (typeof source === 'string' && source.length > 0) ? source : null,
      };
    })
    .sort((a, b) => a.name.localeCompare(b.name));
}

// Return a short usage summary for the browser console bridge.
function wr_usage_text() {
  return [
    'WebRacket console bridge',
    '  WR(name, ...args)        Look up or call a binding and print the WebRacket result.',
    '  WR.call(name, ...args)   Always call the named binding, even with zero arguments.',
    '  WR.value(name, ...args)  Return the converted JavaScript value without printing.',
    '  WR.raw(name, ...args)    Return the full bridge result object.',
    '  WR.write(name, ...args)  Print the WebRacket representation and return the value.',
    '  WR.print(name, ...args)  Inspect the converted JavaScript value with console.dir.',
    '  WR.names()               List exposed binding names.',
    '  WR.search(query)         Search exposed binding names by case-insensitive substring.',
    '  WR.namesDetailed()       List detailed binding metadata.',
    '  WR.format(value)         Format any JS value with the WebRacket formatter.',
  ].join('\\n');
}

// Install globalThis.WR for browser-side access to exported WebRacket bindings.
function install_console_bridge(exports) {
  if (!console_bridge_enabled || !console_bridge_browser) {
    return;
  }

  const { wr_ref, wr_call, wr_names, wr_names_detailed, wr_format } = exports;
  if (!(wr_ref && wr_call && wr_names)) {
    return;
  }

  // Look up or call a binding and decode the tagged bridge result.
  function raw_lookup(name, args = []) {
    const operation = (args.length === 0) ? 'ref' : 'call';
    const raw = (args.length === 0)
      ? wr_invoke_fasl(wr_ref, name)
      : wr_invoke_fasl(wr_call, [name, args]);
    return wr_decode_result(raw, operation, name, args);
  }

  // Call a binding explicitly, even when the argument list is empty.
  function raw_call(name, args = []) {
    const raw = wr_invoke_fasl(wr_call, [name, args]);
    return wr_decode_result(raw, 'call', name, args);
  }

  // Throw a JavaScript Error for bridge failures and return successful results unchanged.
  function ensure_ok(result) {
    if (!result.ok) {
      throw new Error(result.message);
    }
    return result;
  }

  // Print a successful bridge result using the WebRacket formatter output.
  function write_result(result) {
    console.log(result.printed);
    return result.value;
  }

  // Look up or call a WebRacket top-level binding, log its printed form, and return its JS value.
  function WR(name, ...args) {
    return write_result(ensure_ok(raw_lookup(name, args)));
  }

  WR.call = (name, ...args) => write_result(ensure_ok(raw_call(name, args)));
  WR.value = (name, ...args) => ensure_ok(raw_lookup(name, args)).value;
  WR.raw = (name, ...args) => raw_lookup(name, args);
  WR.write = (name, ...args) => write_result(ensure_ok(raw_lookup(name, args)));
  WR.print = (name, ...args) => {
    const result = ensure_ok(raw_lookup(name, args));
    console.dir(result.value);
    return result.value;
  };
  WR.names = () => {
    const names = wr_invoke_fasl(wr_names, null);
    return hostArrayIsArrayForFasl(names) ? names.slice().sort((a, b) => String(a).localeCompare(String(b))) : [];
  };
  WR.search = (query) => {
    const needle = String(query ?? '').toLocaleLowerCase();
    return WR.names().filter((name) => String(name).toLocaleLowerCase().includes(needle));
  };
  WR.namesDetailed = () => {
    if (!wr_names_detailed) {
      return WR.names().map((name) => ({
        name: String(name),
        origin: 'unknown',
        mutable: false,
        kind: 'top-level',
        source: null,
      }));
    }
    return wr_decode_names_detailed(wr_invoke_fasl(wr_names_detailed, null));
  };
  WR.format = (value) => wr_format_value(wr_format, value);
  WR.help = () => {
    const text = wr_usage_text();
    console.log(text);
    return text;
  };

  globalThis.WR = WR;
  console.info('WebRacket console bridge ready. Try WR.help() or WR.names().');
}
