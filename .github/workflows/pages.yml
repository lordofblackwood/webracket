name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "pkgs/**"
      - "webracket.rkt"
      - "web-site/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WASM_TOOLS_VERSION: "1.225.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          version: stable

      - name: Install Scribble tools
        run: raco pkg install --auto --skip-installed --no-docs scribble-tools

      - name: Install nanopass
        run: raco pkg install --auto --skip-installed --no-docs nanopass

      - name: Cache wasm-tools binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/wasm-tools
          key: ${{ runner.os }}-wasm-tools-${{ env.WASM_TOOLS_VERSION }}

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install wasm-tools (prebuilt)
        run: |
          if [ ! -x "$HOME/.local/bin/wasm-tools" ]; then
            mkdir -p "$HOME/.local/bin"
            curl -L -o /tmp/wasm-tools.tar.gz \
              "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
            tar -xzf /tmp/wasm-tools.tar.gz -C /tmp
            cp "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" "$HOME/.local/bin/wasm-tools"
            chmod +x "$HOME/.local/bin/wasm-tools"
          fi
          wasm-tools --version

      # The Pages artifact is a complete site replacement.  Preserve the
      # published manual before adding the WIP manual at its own URL.
      - name: Preserve legacy WebRacket manual
        shell: bash
        run: |
          set -euo pipefail
          legacy_url="https://soegaard.github.io/webracket/webracket"
          legacy_root="web-site/public/webracket"

          rm -rf "$legacy_root"
          mkdir -p "$legacy_root"
          curl --fail --location --retry 3 --output "$legacy_root/index.html" \
            "$legacy_url/index.html"

          mapfile -t legacy_files < <(
            grep -oE '(href|src)="[^"]+"' "$legacy_root/index.html" \
              | sed -E 's/^[^=]+="//; s/"$//' \
              | sed 's/#.*$//' \
              | grep -E '^[A-Za-z0-9_.-]+$' \
              | sort -u)
          for legacy_file in "${legacy_files[@]}"; do
            curl --fail --location --retry 3 --output "$legacy_root/$legacy_file" \
              "$legacy_url/$legacy_file"
          done

      - name: Render WIP WebRacket manual
        env:
          PLTCOLLECTS: "${{ github.workspace }}/pkgs:"
        run: raco scribble --htmls --dest html-wip pkgs/webracket-doc/scribblings/webracket.scrbl

      - name: Publish WIP manual under /webracket-wip/
        run: |
          rm -rf web-site/public/webracket-wip
          mkdir -p web-site/public/webracket-wip
          cp -R html-wip/webracket/. web-site/public/webracket-wip/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
